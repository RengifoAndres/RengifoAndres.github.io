<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Sans+Pro:wght@400;600&amp;display=swap');
    </style>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2a9d8f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#264653;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
      <stop offset="40%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.4);stop-opacity:1" />
      <stop offset="60%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
      <stop offset="100%" style="stop-color:rgba(255,255,255,0);stop-opacity:0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="300" height="200" rx="8" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1"/>

  <!-- Icon: document with pencil -->
  <g transform="translate(125, 30)">
    <rect x="5" y="0" width="35" height="45" rx="3" fill="none" stroke="#264653" stroke-width="2"/>
    <line x1="14" y1="12" x2="32" y2="12" stroke="#2a9d8f" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="20" x2="32" y2="20" stroke="#2a9d8f" stroke-width="2" stroke-linecap="round"/>
    <line x1="14" y1="28" x2="26" y2="28" stroke="#2a9d8f" stroke-width="2" stroke-linecap="round"/>
    <!-- Pencil -->
    <g transform="translate(30, 25) rotate(30)">
      <rect x="0" y="0" width="5" height="22" rx="1" fill="#264653"/>
      <polygon points="0,22 5,22 2.5,28" fill="#264653"/>
      <rect x="0" y="0" width="5" height="4" rx="1" fill="#2a9d8f"/>
    </g>
  </g>

  <!-- "Loading..." text -->
  <text x="150" y="105" font-family="'Source Sans Pro', 'Segoe UI', Arial, sans-serif" font-size="16" font-weight="600" fill="#264653" text-anchor="middle" letter-spacing="0.5">Loading . . .</text>

  <!-- Loading bar background -->
  <rect x="50" y="120" width="200" height="14" rx="7" fill="#e8e8e8"/>

  <!-- Loading bar fill (animated at ~65%) -->
  <rect x="50" y="120" width="130" height="14" rx="7" fill="url(#barGrad)">
    <animate attributeName="width" values="90;130;110;130" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- Shimmer effect -->
  <rect x="50" y="120" width="130" height="14" rx="7" fill="url(#shimmer)" opacity="0.6">
    <animate attributeName="x" values="-80;250" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- "Coming Soon" text -->
  <text x="150" y="160" font-family="'Source Sans Pro', 'Segoe UI', Arial, sans-serif" font-size="13" fill="#7a8288" text-anchor="middle" letter-spacing="1">COMING SOON</text>

  <!-- Dots animation -->
  <circle cx="130" cy="178" r="3" fill="#2a9d8f" opacity="0.3">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="150" cy="178" r="3" fill="#2a9d8f" opacity="0.3">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="170" cy="178" r="3" fill="#2a9d8f" opacity="0.3">
    <animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" begin="0.6s" repeatCount="indefinite"/>
  </circle>
</svg>
